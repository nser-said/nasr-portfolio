<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Nasr Syed Hassanein</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; flex-direction: column; gap: 1rem; padding: 2rem; }
        h1 { font-size: 6rem; color: var(--color-secondary); margin: 0; }
        p { font-size: 1.2rem; color: var(--color-grey-2); max-width: 500px; }
        a { color: var(--color-secondary); text-decoration: underline; }
    </style>
</head>
<body>
    <h1>404</h1>
    <p>Page not found. The page you're looking for doesn't exist or has been moved.</p>
    <a href="/" class="main-btn" style="text-decoration: none;">
        <span class="btn-text">Back to Home</span>
        <span class="btn-icon"><i class="fas fa-home"></i></span>
    </a>
</body>
</html>
